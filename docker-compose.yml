# Local or single-server deployment. Secrets come from .env (never committed).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: radar
    volumes:
      - radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U radar -d radar']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    # The app migrates the database on start, so it must wait until Postgres accepts connections.
    depends_on:
      db:
        condition: service_healthy
    env_file: ${RADAR_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@db:5432/radar
    ports:
      - '127.0.0.1:8787:8787'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
volumes:
  radar-db:
